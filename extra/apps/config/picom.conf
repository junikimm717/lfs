#################################
# mimux picom configuration
#################################
#
# mimux ships no GL stack, so picom runs on the software XRender backend.
# The transparency you actually see comes from st's 32-bit ARGB visual (the
# alpha patch) -- picom composites it. We deliberately do NOT force a global
# inactive/active opacity, so window *text* stays crisp; only st's background
# is see-through. Shadows and a light fade give the desktop some depth.

backend = "xrender";
vsync = true;

# --- Fading ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# --- Shadows ---
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.45;
shadow-color = "#1f1b18";   # warm dark, matches the Mimicoco theme
shadow-exclude = [
  "! name~=''",           # windows with no name (e.g. the root/desktop)
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Opacity ---
# Left at 1.0 on purpose: st provides its own background transparency, and
# forcing opacity here would also dim the text. Tweak if you want everything
# translucent.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# --- Behaviour ---
detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = true;
detect-transient = true;
